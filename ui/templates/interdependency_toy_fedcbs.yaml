name: Interdependency Toy FedCBS
description: Fast CPU FedCBS control under a binary training-label flip attack.
form:
  run_name: interdependency_toy_fedcbs
  random_state: 42
  communication_rounds: 30
  dataset: synthetic_2d
  trust_dataset: ""
  distribution: dirichlet
  distribution_alpha: 2.0
  amount_of_clients: 20
  client_subset_size: 10
  training_batch_size: 64
  manager_batch_size: 2
  device_mode: cpu
  device_ids: "[0]"
  print_client_metrics: false
  federated_method: central_clip
  client_selector: fedcbs
  logger: mlflow
  model: logistic_regression
  model_trainer: image
  optimizer: sgd
  attack_type: binary_label_flip
  attack_scheme: constant
  prop_attack_clients: 0.3
  prop_attack_rounds: 1.0
overrides:
  - training_params.num_workers=0
  - optimizer.lr=0.1
  - federated_method.tau_clip=0.1
